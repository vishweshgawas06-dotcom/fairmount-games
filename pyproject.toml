[build-system]
requires = ["setuptools>=75,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "fairmount-games"
version = "0.1.0"
description = "FairMount Games backend workspace"
requires-python = ">=3.12,<3.14"
dependencies = [
  "alembic>=1.13,<2",
  "fastapi>=0.115,<1",
  "SQLAlchemy>=2.0,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "psycopg[binary]>=3.2,<4",
  "python-dotenv>=1,<2",
  "pytest>=8,<9",
  "ruff>=0.8,<1",
]

[tool.setuptools]
package-dir = {"" = "services/api/src"}

[tool.setuptools.packages.find]
where = ["services/api/src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["services/api/src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
