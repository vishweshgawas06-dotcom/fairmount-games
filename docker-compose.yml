# Local development databases. NOT yet verified by the project owner/CI - see PROJECT_STATUS.md.
# Usage: docker compose up -d
# Dev DB : postgresql+psycopg://fairmount:change-me@localhost:5432/fairmount
# Test DB: postgresql+psycopg://fairmount:fairmount@localhost:5433/fairmount_test
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: fairmount
      POSTGRES_PASSWORD: change-me
      POSTGRES_DB: fairmount
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fairmount -d fairmount"]
      interval: 5s
      timeout: 5s
      retries: 10
  test-db:
    image: postgres:16
    environment:
      POSTGRES_USER: fairmount
      POSTGRES_PASSWORD: fairmount
      POSTGRES_DB: fairmount_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
